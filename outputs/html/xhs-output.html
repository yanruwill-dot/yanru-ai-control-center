<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小红书高级排版</title>
  <style>
    :root { color-scheme: light; --bg:#f4eee3; --ink:#202522; --red:#e5463a; --green:#2f8f64; --line:#dfd2bf; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(135deg,#f4eee3,#fffaf2); color:var(--ink); font-family:"Avenir Next","PingFang SC","Noto Sans SC",sans-serif; }
    .wrap { width:min(1120px,100%); margin:0 auto; padding:34px 18px 54px; }
    header { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:end; margin-bottom:18px; }
    h1 { margin:0; font-size:46px; line-height:1.1; letter-spacing:0; }
    .note { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; line-height:1.7; color:#5e625c; }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .card { aspect-ratio:3/4; background:#fffdf8; border:1px solid var(--line); border-radius:8px; padding:18px; position:relative; overflow:hidden; box-shadow:0 18px 42px rgba(89,59,26,.12); }
    .card::after { content:""; position:absolute; right:-36px; bottom:-36px; width:110px; height:110px; border-radius:50%; background:rgba(229,70,58,.09); }
    .num { width:34px; height:34px; border-radius:50%; background:var(--red); color:#fff; display:grid; place-items:center; font-weight:900; }
    h2 { font-size:30px; line-height:1.18; margin:26px 0 10px; }
    p { margin:0; color:#656a63; line-height:1.75; }
    .tags { margin-top:20px; display:flex; flex-wrap:wrap; gap:8px; }
    .tags span { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 10px; color:var(--green); font-size:13px; font-weight:800; }
    .script { margin-top:18px; background:#202522; color:#f8f1e7; border-radius:8px; padding:20px; line-height:1.9; }
    .switcher { display:flex; justify-content:flex-end; gap:10px; align-items:center; margin-bottom:14px; color:#656a63; font-size:14px; }
    .switcher select { min-width:210px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); padding:10px 12px; }
    @media (max-width:860px){ header{grid-template-columns:1fr;} .cards{grid-template-columns:1fr 1fr;} h1{font-size:36px;} }
    @media (max-width:560px){ .cards{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="switcher">
      <span>行业</span>
      <select id="industryPicker"></select>
    </div>
    <header>
      <div>
        <p style="color:var(--red);font-weight:900;margin:0 0 8px;">小红书图文脚本</p>
        <h1 id="title"></h1>
      </div>
      <div class="note" id="note"></div>
    </header>
    <section class="cards" id="cards"></section>
    <div class="tags" id="tags"></div>
    <section class="script" id="script"></section>
  </main>
  <script src="./content-data.js"></script>
  <script>
    function currentKey() {
      return window.location.hash.replace("#", "") || "education";
    }

    function mountPicker() {
      const picker = document.getElementById("industryPicker");
      picker.innerHTML = Object.entries(window.IndustryContent).map(([key, value]) => `<option value="${key}">${value.label}</option>`).join("");
      picker.value = window.IndustryContent[currentKey()] ? currentKey() : "education";
      picker.addEventListener("change", () => {
        window.location.hash = picker.value;
        renderXhs();
      });
    }

    function renderXhs() {
      const data = window.getIndustryContent();
      document.title = `${data.label}小红书高级排版`;
      document.getElementById("industryPicker").value = currentKey();
      document.getElementById("title").textContent = data.xhsTitle;
      document.getElementById("note").textContent = `目标读者：${data.audience}。首图负责制造反差，后续图文负责给路径，最后一页承接咨询。`;
      document.getElementById("cards").innerHTML = data.xhsCards.map((item, index) => `
        <article class="card">
          <div class="num">${index + 1}</div>
          <h2>${item}</h2>
          <p>${index === 0 ? data.hook : index === data.xhsCards.length - 1 ? data.offer : data.point}</p>
        </article>
      `).join("");
      document.getElementById("tags").innerHTML = [`#${data.label}`, "#AI自动化", "#老板思维", "#内容获客", "#智能体工作流"].map(tag => `<span>${tag}</span>`).join("");
      document.getElementById("script").innerHTML = `<strong>发布正文：</strong><br>${data.hook}<br><br>${data.point}<br><br>这一轮不要只追热点，要把热点变成可交付的内容资产。建议从「${data.offer}」开始跑，先看咨询率，再决定下一轮放大。`;
    }

    mountPicker();
    renderXhs();
    window.addEventListener("hashchange", renderXhs);
  </script>
</body>
</html>
