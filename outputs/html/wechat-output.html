<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公众号高级排版</title>
  <style>
    :root { color-scheme: light; --ink:#1f2522; --muted:#6f756e; --paper:#fbf7ed; --line:#ded5c4; --green:#2f8f64; --gold:#b88234; }
    * { box-sizing: border-box; }
    body { margin:0; background:#e9dfcd; color:var(--ink); font-family:"Songti SC","STSong","Noto Serif SC",serif; }
    .page { width:min(880px, 100%); margin:0 auto; padding:34px 18px 56px; }
    .sheet { background:var(--paper); border:1px solid var(--line); box-shadow:0 24px 80px rgba(65,45,24,.18); padding:42px; border-radius:8px; }
    .eyebrow { color:var(--green); font-size:14px; font-weight:700; letter-spacing:.08em; }
    h1 { margin:12px 0 12px; font-size:42px; line-height:1.18; letter-spacing:0; }
    .lead { margin:0; font-size:18px; line-height:1.9; color:#3d403a; border-left:4px solid var(--green); padding-left:16px; }
    .meta { display:flex; flex-wrap:wrap; gap:10px; margin:24px 0; color:var(--muted); font-size:13px; }
    .meta span { border:1px solid var(--line); border-radius:999px; padding:6px 10px; background:#fffaf0; }
    h2 { margin:34px 0 12px; font-size:24px; }
    p { font-size:17px; line-height:2; margin:0 0 16px; }
    .quote { margin:26px 0; padding:20px; background:#edf6ed; border:1px solid #c9ddca; border-radius:8px; font-size:20px; line-height:1.8; font-weight:700; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:20px 0 4px; }
    .card { background:#fffdf7; border:1px solid var(--line); border-radius:8px; padding:16px; min-height:120px; }
    .card small { color:var(--gold); font-weight:800; }
    .card strong { display:block; margin:8px 0; font-size:18px; }
    .cta { margin-top:32px; padding:24px; background:#1f2522; color:#fbf7ed; border-radius:8px; }
    .cta strong { color:#b7e46b; }
    .switcher { width:min(880px,100%); margin:0 auto 14px; display:flex; justify-content:flex-end; gap:10px; align-items:center; color:#5f665e; font-size:14px; }
    .switcher select { min-width:190px; border:1px solid var(--line); border-radius:8px; background:#fffaf0; padding:10px 12px; color:var(--ink); }
    .hero-visual { margin:28px 0 24px; min-height:260px; border-radius:8px; border:1px solid #d8c7aa; overflow:hidden; position:relative; background:linear-gradient(135deg,#f4dfbf,#fef9ed 48%,#dcefd8); }
    .hero-visual::before { content:""; position:absolute; inset:18px; border:1px solid rgba(47,143,100,.24); border-radius:8px; }
    .visual-copy { position:absolute; left:30px; top:28px; width:min(430px,calc(100% - 60px)); z-index:2; }
    .visual-copy small { color:var(--green); font-weight:900; letter-spacing:.08em; }
    .visual-copy strong { display:block; margin-top:10px; font-size:34px; line-height:1.18; }
    .visual-copy span { display:block; margin-top:12px; color:#4e554d; font-size:15px; line-height:1.7; }
    .visual-orbit { position:absolute; right:28px; bottom:22px; width:260px; height:170px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; transform:rotate(-4deg); }
    .visual-orbit i { border-radius:8px; background:#fffaf0; border:1px solid #d8c7aa; box-shadow:0 16px 32px rgba(80,53,26,.14); position:relative; }
    .visual-orbit i::after { content:""; position:absolute; left:50%; top:50%; width:26px; height:26px; border-radius:50%; transform:translate(-50%,-50%); background:var(--green); opacity:.16; }
    .image-row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:22px 0 10px; }
    .image-card { min-height:168px; border-radius:8px; border:1px solid var(--line); background:#fffdf7; padding:16px; position:relative; overflow:hidden; }
    .image-card::after { content:""; position:absolute; right:-36px; bottom:-36px; width:112px; height:112px; border-radius:50%; background:rgba(47,143,100,.1); }
    .image-card small { color:var(--green); font-weight:900; }
    .image-card strong { display:block; margin:10px 0 8px; font-size:19px; line-height:1.35; }
    .image-card span { color:var(--muted); line-height:1.7; position:relative; z-index:1; }
    @media (max-width:720px){ .sheet{padding:26px 18px;} h1{font-size:32px;} .grid,.image-row{grid-template-columns:1fr;} .switcher{padding:0 18px;} .visual-orbit{position:relative; right:auto; bottom:auto; margin:170px 20px 20px; width:auto;} }
  </style>
</head>
<body>
  <main class="page">
    <div class="switcher">
      <span>行业</span>
      <select id="industryPicker"></select>
    </div>
    <article class="sheet" id="article"></article>
  </main>
  <script src="./content-data.js"></script>
  <script>
    function currentKey() {
      return window.location.hash.replace("#", "") || "education";
    }

    function mountPicker() {
      const picker = document.getElementById("industryPicker");
      picker.innerHTML = Object.entries(window.IndustryContent).map(([key, value]) => `<option value="${key}">${value.label}</option>`).join("");
      picker.value = window.IndustryContent[currentKey()] ? currentKey() : "education";
      picker.addEventListener("change", () => {
        window.location.hash = picker.value;
        renderArticle();
      });
    }

    function renderArticle() {
      const data = window.getIndustryContent();
      document.title = `${data.label}公众号高级排版`;
      document.getElementById("industryPicker").value = currentKey();
      document.getElementById("article").innerHTML = `
      <div class="eyebrow">${data.label} · 公众号长文</div>
      <h1>${data.headline}</h1>
      <p class="lead">${data.subhead}</p>
      <div class="meta"><span>目标读者：${data.audience}</span><span>内容目标：认知升级 + 咨询转化</span><span>排版：可直接打开</span></div>
      <figure class="hero-visual" aria-label="${data.label}首图视觉">
        <div class="visual-copy"><small>首图视觉</small><strong>${data.xhsTitle}</strong><span>${data.point}</span></div>
        <div class="visual-orbit" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </figure>
      <p>${data.hook}</p>
      <div class="quote">${data.point}</div>
      <h2>一、真正的机会，不在热点本身</h2>
      <p>热点只是入口。用户真正关心的是：这件事和我有什么关系，为什么现在必须行动，我照着做能不能得到结果。</p>
      <p>所以内容不能只复述新闻，而要把热点翻译成一套判断：谁会焦虑，谁会受益，谁会先付费。</p>
      <h2>二、今天最值得抓的三个信号</h2>
      <div class="grid">${data.hotspots.map((item, index) => `<div class="card"><small>信号 ${index + 1}</small><strong>${item}</strong><span>适合拆成标题、首图、短视频口播和私域话术。</span></div>`).join("")}</div>
      <div class="image-row">${data.hotspots.map((item, index) => `<figure class="image-card"><small>图像 ${String(index + 1).padStart(2, "0")}</small><strong>${item}</strong><span>画面建议：用真实工作场景、关键数字和一句强判断承接正文。</span></figure>`).join("")}</div>
      <h2>三、把内容做成可交付的产品</h2>
      <p>这套内容链路的关键，不是写一篇好文章，而是让文章、图文、脚本、发布和复盘变成同一条生产线。</p>
      <p>本轮建议主推：<strong>${data.offer}</strong>。先用低门槛内容建立信任，再用具体服务承接咨询。</p>
      <div class="cta"><strong>下一步动作：</strong>用这篇公众号做认知入口，小红书负责放大痛点，整体方案页负责承接客户沟通和团队执行。</div>
    `;
    }

    mountPicker();
    renderArticle();
    window.addEventListener("hashchange", renderArticle);
  </script>
</body>
</html>
