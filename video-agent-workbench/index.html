<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一键追爆 · AI 视频工作台</title>
  <style>
    html,body,iframe { width:100%; height:100%; margin:0; border:0; background:#07080c; }
    iframe { display:block; }
  </style>
</head>
<body>
  <iframe
    id="workbench"
    src="../apps/video-agent-workbench/static/"
    title="一键追爆 AI 视频工作台"
    allow="autoplay"
  ></iframe>
  <script>
    const frame = document.getElementById("workbench");
    const syncConnection = () => {
      frame.src = `../apps/video-agent-workbench/static/${location.hash}`;
    };
    syncConnection();
    addEventListener("hashchange", syncConnection);
  </script>
</body>
</html>
