name: Build video agent container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/video-agent-workbench/**"
      - ".github/workflows/video-agent-container.yml"

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/video-agent-workbench/requirements.txt

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -r apps/video-agent-workbench/requirements.txt

      - name: Run tests
        working-directory: apps/video-agent-workbench
        env:
          VIDEO_AGENT_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: python -m unittest discover -s tests -v

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/video-agent-workbench
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yanru-video-agent:latest
            ghcr.io/${{ github.repository_owner }}/yanru-video-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
